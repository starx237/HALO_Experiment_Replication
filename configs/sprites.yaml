data: sprites
seed: 314159
cuda: True
# gpu_ids 填写所用的 GPU 编号，必须为 3 个，若只有 1 个则填写 3 个 0
gpu_ids:
  - 0
  - 0
  - 0
num_workers: 12

test_epoch: 800
mode: train

sprites:
  rows: 64
  columns: 64
  channels: 3
  timesteps: ???
  tanh: True
  directions: 
    - front
    - left
    - right
  actions:
    - walk
    - spellcard
    - slash
# path: [以下此处需填入 .../Sprites-master/npy/ 所在完整路径]
  path: 

trainer:
 batch_size_train: 24
 batch_size_test: 16
 num_epochs: 800
 PretrainEpochs: 80
 test_every: 20
 save_every: 20
 recon_term: 1
 resume: False
 resume_epoch: 400
 BetaV: 1
 BetaV1: 1
 BetaZ: 1
 BetaT: 2
 annealkl: False
 reconloss: l2
 lossVrecon: True
 temporalLoss: False
 actions: ???
 nm_seq: ???

 model:
  condnSonU: False
  useZ: True
  uselstmZ: True
  projection: True
  pretrain: False
  sequential: ???
  qv_x: qv_f_x1toT
  v_dim: 36
  h_dim: 2048
  z_dim: 256
  nm_operators: 3
  network: conv
  decoder: conv
  coords: none
  L: 8
  u_dim: ???
  channels: ???
  width: ???
  height: ???
  timesteps: ???
  dynamics: Hamiltonian

 optim:
   lamda_gp: 10
   lr: 0.0002
   lr_policy: step
   step_size: 200
   gamma: 0.1
   beta1: 0.5
   beta2: 0.999


# 以下路径填写[项目路径]/model(或 results, classifier_sprites)
output_model: 
output_results: 
classifierPath: 
